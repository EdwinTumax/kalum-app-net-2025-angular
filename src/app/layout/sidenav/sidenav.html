<mat-nav-list>
    <mat-list-item>
        <mat-icon>dashboard</mat-icon>
        <span class="menu-text" (click)="dashboard()">Dashboard</span>
    </mat-list-item>

    <mat-list-item>
        <mat-icon>calendar_month</mat-icon>
        <span class="menu-text" (click)="examenesAdmision()">Examen admisión</span>
    </mat-list-item>
    
    <mat-list-item *ngIf="authService.hasRole('ROLE_STUDENT')">
        <mat-icon>credit_card</mat-icon>
        <span class="menu-text">Cuenta Corriente</span>
    </mat-list-item>

    <mat-list-item *ngIf="authService.isAuthenticated()">
        <mat-icon color="accent">event_available</mat-icon>
        <span class="menu-text" (click)="estatusExamenAdmision()">Resultado Examen</span>
    </mat-list-item>

    <mat-list-item *ngIf="authService.hasRole('ROLE_CANDIDATE')">
        <mat-icon>people</mat-icon>
        <span class="menu-text" (click)="estatusExamenAdmision()">Usuarios</span>
    </mat-list-item>

    <mat-list-item *ngIf="authService.hasRole('ROLE_ADMIN')">
        <mat-icon>security</mat-icon>
        <span class="menu-text" (click)="roles()">Roles</span>
    </mat-list-item>
</mat-nav-list>
